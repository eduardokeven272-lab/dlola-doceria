<!doctype html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/jpeg" href="../img/logo.jpeg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar no painel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div>
      <p class="eyebrow" style="font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--rose)">Área administrativa</p>
      <h1>Entrar no <em>painel</em></h1>
    </div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">E-mail (Gmail)</label><input type="email" id="email" autocomplete="username" placeholder="voce@gmail.com" required></div>
      <div class="field"><label for="pass">Senha</label><input type="password" id="pass" autocomplete="current-password" required></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="go">Entrar</button>
    </form>
        <a class="link-btn" href="../index.html" style="text-align:center">← Voltar ao site</a>
  </div>
</main>
<script src="../js/ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.SUPABASE_URL='https://wrvxyvmovsdmrvxfzyrt.supabase.co'; window.SUPABASE_ANON_KEY='sb_publishable_HVEi8ycSMKdd_7H5q-9A2Q_zkhoGH-F';</script>
<script src="../js/db.js"></script>
<script>
  (function () {
    (async function () {
      if (await DB.auth.current()) { location.replace('painel.html'); return; }
      var f = document.getElementById('loginForm'), err = document.getElementById('err');
      f.addEventListener('submit', async function (e) {
      e.preventDefault(); err.textContent = '';
      var b = document.getElementById('go'); b.disabled = true;
      try {
        await DB.auth.login(document.getElementById('email').value, document.getElementById('pass').value);
        location.replace('painel.html');
      } catch (ex) { err.textContent = ex.message; b.disabled = false; }
      });
    })();
  })();
</script>
</body>
</html>
